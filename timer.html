<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenieTech — Juré Timer</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--text:#0f172a;--muted:#5b6577;
  --green:#15803d;--greenBg:#dcfce7;--red:#b91c1c;--redBg:#fee2e2;
  --blue:#1d4ed8;--gold:#a16207;--goldBg:#fef3c7;--line:#e2e6ee;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 4px}
.brand{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}
.conn{font-size:11px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:center}

.teamLabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
.teamName{font-size:clamp(28px,8vw,44px);font-weight:900;color:var(--text);min-height:1.2em}
.teamName.waiting{color:var(--muted);font-size:clamp(18px,5vw,26px)}
.questionMeta{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}

.timerBig{font-size:clamp(60px,18vw,110px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1;margin:10px 0}
.timerBig.off{color:var(--muted)}
.timerBig.running{color:var(--green)}
.timerBig.warning{color:var(--gold)}
.timerBig.danger{color:var(--red)}

.btnRow{display:flex;flex-direction:column;gap:14px;flex:1}
.bigBtn{
  padding:28px 20px;border-radius:20px;border:none;font-weight:900;font-size:24px;color:white;
  cursor:pointer;box-shadow:var(--shadow);letter-spacing:.02em;
}
.bigBtn.start{background:linear-gradient(180deg,#22c55e,#15803d)}
.bigBtn.stop{background:linear-gradient(180deg,#ef4444,#b91c1c)}
.bigBtn:disabled{opacity:.3;cursor:default}
.bigBtn:active:not(:disabled){transform:translateY(2px)}

.loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.loginCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);max-width:340px;width:100%;text-align:center}
.loginCard .brand{margin-bottom:4px}
.loginCard h2{font-size:18px;font-weight:800;margin:6px 0 18px}
.loginCard input{width:100%;padding:14px 16px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:#f4f6f9;color:var(--text);margin-bottom:12px}
.loginCard button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);color:white;font-weight:800;font-size:15px;cursor:pointer}
.loginError{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-bottom:4px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- Écran de connexion - accès protégé par mot de passe -->
<div id="loginScreen" class="loginScreen">
  <div class="loginCard">
    <div class="brand">GENIETECH · JURÉ TIMER</div>
    <h2>Accès protégé</h2>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="off">
    <div class="loginError" id="loginError"></div>
    <button onclick="checkPassword()">Entrer</button>
  </div>
</div>

<div id="app" class="wrap hidden">

  <div class="topbar">
    <div class="brand">GENIETECH · JURÉ TIMER</div>
    <div id="connText" class="conn">connexion...</div>
  </div>

  <div class="card">
    <div class="teamLabel">Équipe qui répond</div>
    <div id="teamName" class="teamName waiting">En attente...</div>
    <div id="questionMeta" class="questionMeta"></div>
  </div>

  <div class="card">
    <div id="timerBig" class="timerBig off">--:--</div>
  </div>

  <div class="btnRow">
    <button class="bigBtn start" id="btnStartTimer" onclick="startTimer()" disabled>▶️ Démarrer</button>
    <button class="bigBtn stop" id="btnStopTimer" onclick="stopTimer()" disabled>⏹️ Stop</button>
  </div>

</div>

<script>
  // ==== A CONFIGURER ====
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwITBnp3_airQfBXI5BOjo1ty3-Jkmp-dwNI2aXyw7c2HpNlruAXT9AqzwAqgSrr0E0/exec";
  const POLL_INTERVAL_MS = 500;
  // =======================

  const TIMER_PASSWORD = "@TimerJeu26*";
  let authenticated = false;
  let busy = false;

  function checkPassword(){
    const input = document.getElementById('loginPassword');
    const error = document.getElementById('loginError');
    if(input.value === TIMER_PASSWORD){
      authenticated = true;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      poll();
      setInterval(poll, POLL_INTERVAL_MS);
    }else{
      error.textContent = 'Mot de passe incorrect';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPassword();
  });

  async function poll(){
    if(!authenticated) return;
    const conn = document.getElementById('connText');
    try{
      const res = await fetch(SCRIPT_URL + '?t=' + Date.now(), { method:'GET', cache:'no-store' });
      const data = await res.json();
      conn.textContent = '';
      render(data);
    }catch(err){
      conn.textContent = 'connexion instable...';
    }
  }

  function render(data){
    const teamName = document.getElementById('teamName');
    const questionMeta = document.getElementById('questionMeta');
    const btnStartTimer = document.getElementById('btnStartTimer');
    const btnStopTimer = document.getElementById('btnStopTimer');

    // Équipe désignée (buzz, sélection manuelle ou automatique en Finale)
    if(data.activeTeam && data.etat === 'BUZZ_RECU'){
      teamName.textContent = data.activeTeam;
      teamName.className = 'teamName';
      questionMeta.textContent = (data.questionId || '') + (data.questionType ? ' · ' + data.questionType : '');

      if(data.timerRunning){
        btnStartTimer.disabled = true;
        btnStopTimer.disabled = false;
      }else{
        btnStartTimer.disabled = false;
        btnStopTimer.disabled = true;
      }
    }else{
      teamName.textContent = 'En attente...';
      teamName.className = 'teamName waiting';
      questionMeta.textContent = '';
      btnStartTimer.disabled = true;
      btnStopTimer.disabled = true;
    }

    updateTimer(data);
  }

  function updateTimer(data){
    const timerBig = document.getElementById('timerBig');

    let remaining = null;
    if(data.questionEndAt != null && data.questionActive){
      remaining = Math.max(0, Math.ceil((data.questionEndAt - Date.now()) / 1000));
    }

    if(remaining == null || !data.questionActive){
      timerBig.textContent = '--:--';
      timerBig.className = 'timerBig off';
      return;
    }

    timerBig.textContent = formatTime(remaining);
    timerBig.className = 'timerBig ' + (remaining<=5?'danger':remaining<=10?'warning':'running');
  }

  function formatTime(seconds){
    const m = Math.floor(seconds/60);
    const s = seconds%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  async function callAction(payload){
    if(busy) return;
    busy = true;
    try{
      const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if(data && data.ok === false){
        alert(data.error || 'Action refusée');
      }
      await poll();
    }catch(err){
      alert('Connexion échouée, réessayez.');
    }finally{
      busy = false;
    }
  }

  function startTimer(){ callAction({ action:'startTimer' }); }
  function stopTimer(){ callAction({ action:'stopTimer' }); }
</script>
</body>
</html>
