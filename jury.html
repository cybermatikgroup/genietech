<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenieTech — Jury</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--panel2:#eef1f6;--text:#0f172a;--muted:#5b6577;
  --green:#15803d;--greenBg:#dcfce7;--red:#b91c1c;--redBg:#fee2e2;
  --blue:#1d4ed8;--gold:#a16207;--goldBg:#fef3c7;--line:#e2e6ee;--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 4px}
.brand{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}
.contextLabel{font-size:16px;font-weight:800;color:var(--text)}
.conn{font-size:11px;color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:800}

.scoreRow{display:flex;gap:10px}
.scoreCard{flex:1;background:var(--panel2);border-radius:12px;padding:12px;text-align:center;border:2px solid transparent}
.scoreCard.leader{border-color:var(--gold);background:var(--goldBg)}
.scoreCard .name{font-weight:800;font-size:15px;color:var(--text)}
.scoreCard .pts{font-size:30px;font-weight:900;margin-top:2px;color:var(--text)}

.qMeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.qMeta span{background:var(--panel2);padding:3px 9px;border-radius:999px;font-weight:700}
.qText{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:10px;color:var(--text);white-space:pre-line}
.qAnswer{font-size:14px;font-weight:600;color:var(--green);background:var(--greenBg);border:1px solid #bbf7d0;border-radius:10px;padding:10px;margin-bottom:10px}
.timerBig{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0;color:var(--muted)}
.timerBig.danger{color:var(--red)}
.timerBig.warning{color:var(--gold)}
.timerBig.running{color:var(--green)}
.timerBig.off{color:var(--muted)}

.activeTeam{font-size:22px;font-weight:900;text-align:center;color:var(--green);margin:6px 0}
.msg{text-align:center;font-size:15px;color:var(--muted);padding:6px 0;min-height:40px}

.btnRow{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:16px 10px;border-radius:12px;border:none;font-weight:800;font-size:15px;color:white;cursor:pointer;box-shadow:var(--shadow)}
.btn.primary{background:#2563eb}
.btn.good{background:#16a34a}
.btn.bad{background:#dc2626}
.btn.neutral{background:#64748b}
.btn.skip{background:#8b5cf6}
.btn.topchrono{background:#a16207}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn:active:not(:disabled){transform:translateY(2px)}

.teamPickRow{display:flex;gap:10px}
.teamPickBtn{flex:1;padding:16px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800;font-size:15px;cursor:pointer}
.teamPickBtn .star{color:var(--gold);margin-left:4px}

.contextRow{display:flex;gap:8px;flex-wrap:wrap}
.ctxBtn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.ctxBtn.active{background:var(--blue);color:white;border-color:var(--blue)}

.dangerZone{opacity:.85}
.dangerZone button{background:var(--redBg);color:var(--red);border:1px solid #fecaca;box-shadow:none}

/* Écran de connexion (mot de passe) */
.loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.loginCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);max-width:340px;width:100%;text-align:center}
.loginCard .brand{margin-bottom:4px}
.loginCard h2{font-size:18px;font-weight:800;margin:6px 0 18px}
.loginCard input{width:100%;padding:14px 16px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-bottom:12px}
.loginCard button{width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);color:white;font-weight:800;font-size:15px;cursor:pointer}
.loginError{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-bottom:4px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- ✅ Écran de connexion - accès jury protégé par mot de passe (côté client) -->
<div id="loginScreen" class="loginScreen">
  <div class="loginCard">
    <div class="brand">GENIETECH · JURY</div>
    <h2>Accès protégé</h2>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="off">
    <div class="loginError" id="loginError"></div>
    <button onclick="checkPassword()">Entrer</button>
  </div>
</div>

<div id="app" class="wrap hidden">

  <div class="topbar">
    <div class="brand">GENIETECH · JURY</div>
    <div style="text-align:right">
      <div id="contextLabel" class="contextLabel">—</div>
      <div id="connText" class="conn">connexion...</div>
    </div>
  </div>

  <div class="card">
    <h3>Contexte</h3>
    <div class="contextRow">
      <button class="ctxBtn" id="ctxDuel1" onclick="setContext('Phase 1','Duel 1')">Duel 1</button>
      <button class="ctxBtn" id="ctxDuel2" onclick="setContext('Phase 1','Duel 2')">Duel 2</button>
      <button class="ctxBtn" id="ctxFinale" onclick="setContext('Finale','')">Finale</button>
    </div>
  </div>

  <div class="card">
    <h3>Scores</h3>
    <div class="scoreRow" id="scoreRow"></div>
  </div>

  <div class="card">
    <h3>Question en cours</h3>
    <div id="qMeta" class="qMeta"></div>
    <div id="qText" class="qText">Aucune question active</div>
    <div id="qAnswer" class="qAnswer" style="display:none"></div>
    <div id="timerBig" class="timerBig off">--:--</div>
    <div id="activeTeamLine" class="activeTeam" style="display:none"></div>
    <div id="msg" class="msg"></div>

    <div id="teamPickZone" style="display:none;margin-top:8px">
      <div class="teamPickRow" id="teamPickRow"></div>
    </div>

    <div class="btnRow" style="margin-top:8px">
      <button class="btn topchrono" id="btnTopChrono" onclick="topChrono()" style="display:none">⏱️ Top Chrono</button>
    </div>

    <div class="btnRow" style="margin-top:12px">
      <button class="btn primary" id="btnStart" onclick="startQuestion()">Question suivante</button>
      <button class="btn skip" id="btnSkip" onclick="skipQuestion()">Passer</button>
      <button class="btn neutral" id="btnSub" onclick="startSubsidiaire()">Subsidiaire</button>
    </div>
    <div class="btnRow" style="margin-top:10px">
      <button class="btn good" id="btnCorrect" onclick="markCorrect()" disabled>✓ Bonne réponse</button>
      <button class="btn bad" id="btnWrong" onclick="markWrong()" disabled>✗ Mauvaise réponse</button>
    </div>
  </div>

  <div class="card dangerZone">
    <h3>Zone danger</h3>
    <button class="btn" onclick="resetGame()">Réinitialiser la partie</button>
  </div>

</div>

<script>
  // ==== A CONFIGURER ====
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuJMaKi6EvPAlEGRKmtxV994zRJz36m12iD9nSJPzglmi3gDxW1zgyTGEgAISwfpgZNg/exec";
  const POLL_INTERVAL_MS = 1000;
  // =======================

  // ✅ Mot de passe d'accès (protection simple côté client, suffisante pour
  // un jeu en présentiel d'1h - n'empêche pas un accès technique direct à l'API)
  const JURY_PASSWORD = "@juryJeu26*";
  let authenticated = false;

  function checkPassword(){
    const input = document.getElementById('loginPassword');
    const error = document.getElementById('loginError');
    if(input.value === JURY_PASSWORD){
      authenticated = true;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      poll();
      setInterval(poll, POLL_INTERVAL_MS);
    }else{
      error.textContent = 'Mot de passe incorrect';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPassword();
  });

  let lastState = null;
  let busy = false;

  async function poll(){
    if(!authenticated) return;
    const conn = document.getElementById('connText');
    try{
      const res = await fetch(SCRIPT_URL + '?jury=1&t=' + Date.now(), { method:'GET', cache:'no-store' });
      const data = await res.json();
      conn.textContent = '';
      lastState = data;
      render(data);
    }catch(err){
      conn.textContent = 'connexion instable...';
    }
  }

  function render(data){
    document.getElementById('contextLabel').textContent = data.phaseLabel || '—';

    document.getElementById('ctxDuel1').classList.toggle('active', data.phase==='Phase 1' && data.duel==='Duel 1');
    document.getElementById('ctxDuel2').classList.toggle('active', data.phase==='Phase 1' && data.duel==='Duel 2');
    document.getElementById('ctxFinale').classList.toggle('active', data.phase==='Finale');

    renderScores(data);
    renderQuestion(data);
  }

  function contextTeams(data){
    if(data.phase === 'Finale'){
      return (data.teams||[]).filter(t => String(t.qualifiee).trim() === 'Oui');
    }
    return (data.teams||[]).filter(t => t.duel === data.duel);
  }

  function renderScores(data){
    const teams = contextTeams(data);
    const row = document.getElementById('scoreRow');
    row.innerHTML = '';
    const maxScore = Math.max(...teams.map(t=>t.score), -Infinity);
    teams.forEach(t=>{
      const div = document.createElement('div');
      div.className = 'scoreCard' + (t.score===maxScore && teams.length>1 ? ' leader':'');
      div.innerHTML = '<div class="name">'+escapeHtml(t.equipe)+'</div><div class="pts">'+t.score+'</div>';
      row.appendChild(div);
    });
  }

  function renderQuestion(data){
    const qMeta = document.getElementById('qMeta');
    const qText = document.getElementById('qText');
    const qAnswer = document.getElementById('qAnswer');
    const timerBig = document.getElementById('timerBig');
    const activeLine = document.getElementById('activeTeamLine');
    const msg = document.getElementById('msg');
    const teamPickZone = document.getElementById('teamPickZone');
    const teamPickRow = document.getElementById('teamPickRow');
    const btnCorrect = document.getElementById('btnCorrect');
    const btnWrong = document.getElementById('btnWrong');
    const btnStart = document.getElementById('btnStart');
    const btnSkip = document.getElementById('btnSkip');
    const btnTopChrono = document.getElementById('btnTopChrono');

    // ✅ Mise à jour du chrono
    updateTimer(data);

    // Par défaut, Top Chrono est caché - affiché seulement dans le cas précis
    // "question DIRECTE/PROBLEME, équipe sélectionnée, chrono pas encore lancé"
    btnTopChrono.style.display = 'none';

    if(!data.questionId){
      qMeta.innerHTML = '';
      qText.textContent = 'Aucune question active';
      qAnswer.style.display = 'none';
      timerBig.textContent = '--:--';
      timerBig.className = 'timerBig off';
      activeLine.style.display = 'none';
      msg.textContent = data.messageEcran || '';
      teamPickZone.style.display = 'none';
      btnCorrect.disabled = true;
      btnWrong.disabled = true;
      btnStart.disabled = false;
      btnSkip.disabled = true;
      return;
    }

    qMeta.innerHTML = '<span>'+escapeHtml(data.questionId)+'</span><span>'+escapeHtml(data.questionType||'')+'</span>' +
      (data.questionNumber ? '<span>N° '+data.questionNumber+' / '+data.totalQuestions+'</span>' : '');
    qText.textContent = data.questionText || '(texte à compléter dans le Sheet)';

    if(data.questionAnswer){
      qAnswer.style.display = 'block';
      qAnswer.textContent = 'Réponse : ' + data.questionAnswer;
    }else{
      qAnswer.style.display = 'none';
    }

    btnSkip.disabled = false;

    // ============================================================
    // Question DIRECTE / PROBLEME - système "Top Chrono"
    // ============================================================
    // La question s'affiche et reste affichée SANS chrono pendant que
    // l'animateur la lit. Le jury sélectionne l'équipe (sans lancer de
    // chrono), puis clique "Top Chrono" quand l'équipe est prête à
    // répondre - c'est ce clic qui démarre les 10 secondes.
    if(data.questionType && !data.buzzerEnabled){
      btnStart.disabled = data.etat !== 'TERMINEE' && data.etat !== 'EN_ATTENTE';
      btnSkip.disabled = true;

      if(data.etat === 'QUESTION_ACTIVE' && !data.activeTeam){
        // En attente de sélection (1ère question du contexte, ou retry en
        // Finale après un échec : l'équipe qui a déjà raté est exclue)
        teamPickZone.style.display = 'block';
        const already = data.lockedTeams || [];
        const teams = contextTeams(data).filter(t => already.indexOf(t.equipe) === -1);
        teamPickRow.innerHTML = '';
        const maxScore = Math.max(...teams.map(t=>t.score), -Infinity);
        teams.forEach(t=>{
          const b = document.createElement('button');
          b.className = 'teamPickBtn';
          b.innerHTML = escapeHtml(t.equipe) + (t.score===maxScore && teams.length>1 ? '<span class="star">★</span>' : '');
          b.onclick = () => assignDirect(t.equipe);
          teamPickRow.appendChild(b);
        });
        activeLine.style.display = 'none';
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        msg.textContent = data.messageEcran || 'Sélectionnez l\'équipe qui répond';
      }else if(data.etat === 'QUESTION_ACTIVE' && data.activeTeam){
        // Équipe sélectionnée, chrono pas encore lancé - on attend le clic
        // "Top Chrono" (l'animateur est en train de terminer sa lecture /
        // de poser la question à voix haute)
        teamPickZone.style.display = 'none';
        activeLine.style.display = 'block';
        activeLine.textContent = data.activeTeam + ' sélectionnée';
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        btnTopChrono.style.display = 'block';
        btnTopChrono.disabled = false;
        msg.textContent = data.messageEcran || 'Cliquez sur Top Chrono quand l\'équipe est prête';
      }else if(data.etat === 'BUZZ_RECU'){
        // Chrono lancé, l'équipe répond
        teamPickZone.style.display = 'none';
        activeLine.style.display = 'block';
        activeLine.textContent = data.activeTeam + ' répond';
        btnCorrect.disabled = false;
        btnWrong.disabled = false;
        msg.textContent = data.messageEcran || '';
      }else{
        teamPickZone.style.display = 'none';
        activeLine.style.display = 'none';
        btnCorrect.disabled = true;
        btnWrong.disabled = true;
        msg.textContent = data.messageEcran || '';
      }
      return;
    }

    // ============================================================
    // BUZZ / SUBSIDIAIRE - inchangé (chrono 15s visible dès l'affichage)
    // ============================================================
    teamPickZone.style.display = 'none';
    btnStart.disabled = data.etat !== 'TERMINEE' && data.etat !== 'EN_ATTENTE';

    // ✅ Message "Équipe B a la main" en Phase 3
    if(data.tempsPhase === 'ATTENTE_SECOND'){
      const teams = contextTeams(data);
      const already = data.lockedTeams || [];
      const otherTeam = teams.find(t => already.indexOf(t.equipe) === -1);
      if(otherTeam){
        msg.textContent = '⏳ ' + otherTeam.equipe + ' a la main (' + getRemainingTime(data) + 's)';
      } else {
        msg.textContent = data.messageEcran || '';
      }
    } else if(data.activeTeam){
      msg.textContent = data.messageEcran || '';
    } else {
      msg.textContent = data.messageEcran || '';
    }

    if(data.activeTeam){
      activeLine.style.display = 'block';
      activeLine.textContent = data.activeTeam + ' a buzzé';
      btnCorrect.disabled = false;
      btnWrong.disabled = false;
    }else{
      activeLine.style.display = 'none';
      btnCorrect.disabled = true;
      btnWrong.disabled = true;
    }
  }

  // ✅ Fonction pour récupérer le temps restant
  function getRemainingTime(data){
    if(data.questionEndAt != null && data.questionActive){
      return Math.max(0, Math.ceil((data.questionEndAt - Date.now()) / 1000));
    }
    return 0;
  }

  // ✅ Mise à jour du chrono
  function updateTimer(data){
    const timerBig = document.getElementById('timerBig');

    let remaining = null;
    if(data.questionEndAt != null && data.questionActive){
      remaining = Math.max(0, Math.ceil((data.questionEndAt - Date.now()) / 1000));
    }

    if(remaining == null || !data.questionActive){
      timerBig.textContent = '--:--';
      timerBig.className = 'timerBig off';
      return;
    }

    timerBig.textContent = formatTime(remaining);
    timerBig.className = 'timerBig ' + (remaining<=5?'danger':remaining<=10?'warning':'running');
  }

  function formatTime(seconds){
    const m=Math.floor(seconds/60);
    const s=seconds%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  async function callAction(payload){
    if(busy) return;
    busy = true;
    try{
      const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if(data && data.ok === false){
        alert(data.error || 'Action refusée');
      }
      await poll();
    }catch(err){
      alert('Connexion échouée, réessayez.');
    }finally{
      busy = false;
    }
  }

  function startQuestion(){ callAction({ action:'startQuestion', mode:'auto' }); }
  function skipQuestion(){ callAction({ action:'skipQuestion' }); }

  function startSubsidiaire(){
    if(!lastState) return;
    const id = lastState.duel === 'Duel 2' ? 'S02' : 'S01';
    callAction({ action:'startQuestion', questionId:id });
  }

  function assignDirect(equipe){ callAction({ action:'assignDirect', equipe:equipe }); }
  function topChrono(){ callAction({ action:'topChrono' }); }
  function markCorrect(){ callAction({ action:'correct' }); }
  function markWrong(){ callAction({ action:'wrong' }); }
  function setContext(phase,duel){ callAction({ action:'setContext', phase:phase, duel:duel }); }

  function resetGame(){
    if(!confirm('Réinitialiser toute la partie ? Cette action est irréversible.')) return;
    callAction({ action:'resetGame' });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // Le polling ne démarre qu'après authentification (voir checkPassword())
</script>
</body>
</html>
