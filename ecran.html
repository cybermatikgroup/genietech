<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenieTech — Grand Écran</title>
<style>
:root{--bg:#050914;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--gold:#facc15;--card:#0b1324}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}

.screen{width:100vw;height:100vh;display:flex;flex-direction:column;padding:2.5vh 4vw;gap:2vh}

.scoreRow{display:flex;gap:14px;justify-content:center;flex-shrink:0}
.scoreCard{flex:1;max-width:280px;background:var(--card);border-radius:12px;padding:1.2vh 12px;text-align:center;border:2px solid transparent}
.scoreCard.leader{border-color:var(--gold)}
.scoreCard .name{font-size:clamp(12px,1.3vw,17px);font-weight:700;letter-spacing:.03em}
.scoreCard .pts{font-size:clamp(22px,3vw,34px);font-weight:900;margin-top:2px}
.scoreCard.leader .pts{color:var(--gold)}
.scoreCard:not(.leader) .pts{color:var(--green)}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:2vh}

.question{text-align:center;font-weight:800;line-height:1.35;max-width:92vw;white-space:pre-line;overflow-wrap:break-word;word-break:break-word}
.question.size-lg{font-size:clamp(24px,3.2vw,46px)}
.question.size-md{font-size:clamp(20px,2.6vw,36px)}
.question.size-sm{font-size:clamp(17px,2.1vw,28px)}
.question.size-xs{font-size:clamp(15px,1.7vw,22px)}

.timer{font-size:clamp(36px,5.5vw,80px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums;flex-shrink:0}
.timer.running{color:var(--green)}
.timer.warning{color:var(--gold)}
.timer.danger{color:var(--red);animation:dangerPulse .8s infinite}
@keyframes dangerPulse{50%{opacity:.45}}
.hidden{display:none !important}

.team{font-size:clamp(18px,2.6vw,38px);font-weight:900;color:var(--green);flex-shrink:0}
.team.buzzIn{animation:buzzIn .35s ease-out}
@keyframes buzzIn{0%{transform:scale(1.1);opacity:.2}100%{transform:scale(1);opacity:1}}

.connection{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:var(--red);font-size:11px;opacity:.7}

#soundOverlay{position:fixed;inset:0;background:rgba(5,9,20,.94);display:flex;align-items:center;justify-content:center;z-index:50}
#enableSoundBtn{padding:14px 24px;border-radius:12px;border:none;background:#22c55e;color:#04120a;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:40"></canvas>

<div class="screen">
  <div id="normalView" style="display:flex;flex-direction:column;height:100%;gap:2vh">
    <div id="scoreRow" class="scoreRow"></div>
    <div class="main">
      <div id="question" class="question size-lg">En attente de la prochaine question</div>
      <div id="timer" class="timer hidden">00:00</div>
      <div id="team" class="team hidden"></div>
    </div>
  </div>

  <div id="winnerView" class="hidden" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:2vh">
    <div style="font-size:clamp(16px,2vw,26px);color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase">🏆 Vainqueur du duel</div>
    <div id="winnerName" class="question size-lg"></div>
  </div>
</div>

<div id="connection" class="connection"></div>

<div id="soundOverlay">
  <button id="enableSoundBtn">🔊 Activer le son</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwITBnp3_airQfBXI5BOjo1ty3-Jkmp-dwNI2aXyw7c2HpNlruAXT9AqzwAqgSrr0E0/exec";
const POLL_INTERVAL_MS = 500;

let previousTeam = null;
let previousDuelKey = null;
let audioCtx = null;
let soundEnabled = false;
let firstPoll = true;

document.getElementById('enableSoundBtn').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundEnabled = true;
  document.getElementById('soundOverlay').style.display = 'none';
});

function playBuzzSound(){
  if(!soundEnabled || !audioCtx) return;
  try{
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }catch(err){ /* son non supporte */ }
}

async function poll(){
  const connection = document.getElementById('connection');
  try{
    const response = await fetch(SCRIPT_URL + '?t=' + Date.now(), { method:'GET', cache:'no-store' });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const state = await response.json();
    connection.textContent = '';
    applyState(state);
  }catch(error){
    connection.textContent = 'Connexion au serveur indisponible';
  }
}

function applyState(data){
  updateScores(data);
  updateQuestion(data);
  updateTimer(data);
  updateTeam(data);
  updateDuelWinner(data);
  firstPoll = false;
}

// Scores des 2 équipes du contexte actif (Duel 1 / Duel 2 / Finale)
function contextTeams(data){
  const teams = data.teams || [];
  if(data.phase === 'Finale'){
    return teams.filter(t => String(t.qualifiee).trim() === 'Oui');
  }
  return teams.filter(t => t.duel === data.duel);
}

function updateScores(data){
  const row = document.getElementById('scoreRow');
  const teams = contextTeams(data);
  row.innerHTML = '';
  const maxScore = Math.max(...teams.map(t => t.score), -Infinity);
  teams.forEach(t => {
    const div = document.createElement('div');
    div.className = 'scoreCard' + (t.score === maxScore && teams.length > 1 ? ' leader' : '');
    div.innerHTML = '<div class="name">' + escapeHtml(t.equipe) + '</div><div class="pts">' + t.score + '</div>';
    row.appendChild(div);
  });
}

// Taille de police adaptative : plus la question (avec ses options) est
// longue, plus la police est réduite, pour que tout tienne toujours à
// l'écran sans jamais être coupé.
function updateQuestion(data){
  const q = document.getElementById('question');
  const text = data.questionText || 'En attente de la prochaine question';
  q.textContent = text;

  const len = text.length;
  let sizeClass = 'size-lg';
  if(len > 260) sizeClass = 'size-xs';
  else if(len > 160) sizeClass = 'size-sm';
  else if(len > 80) sizeClass = 'size-md';

  q.className = 'question ' + sizeClass;
}

function updateTimer(data){
  const timer = document.getElementById('timer');

  let remaining = null;
  if(data.questionEndAt != null && data.questionActive){
    remaining = Math.max(0, Math.ceil((data.questionEndAt - Date.now()) / 1000));
  }

  if(remaining == null || !data.questionActive){
    timer.classList.add('hidden');
    return;
  }

  timer.classList.remove('hidden');
  timer.textContent = formatTime(remaining);
  timer.className = 'timer ' + (remaining<=5?'danger':remaining<=10?'warning':'running');
}

function updateTeam(data){
  const team = document.getElementById('team');
  const activeTeam = data.activeTeam || null;

  if(!activeTeam){
    team.classList.add('hidden');
    previousTeam = null;
    return;
  }

  team.classList.remove('hidden');
  team.textContent = activeTeam;

  const key = String(activeTeam) + '|' + String(data.questionId ?? '');
  if(key !== previousTeam){
    team.classList.remove('buzzIn');
    void team.offsetWidth;
    team.classList.add('buzzIn');
    if(!firstPoll) playBuzzSound();
  }
  previousTeam = key;
}

function updateDuelWinner(data){
  const normalView = document.getElementById('normalView');
  const winnerView = document.getElementById('winnerView');
  const winnerName = document.getElementById('winnerName');
  const winnerLabel = winnerView.querySelector('div');

  const isChampion = !!data.champion;
  const isDuelWinner = data.duelFinished && data.duelWinner;

  if(isChampion || isDuelWinner){
    normalView.classList.add('hidden');
    winnerView.classList.remove('hidden');

    if(isChampion){
      winnerLabel.textContent = '🏆🏆 CHAMPION DU JEU';
      winnerName.textContent = data.champion;
    }else{
      winnerLabel.textContent = '🏆 Vainqueur du duel';
      winnerName.textContent = data.duelWinner;
    }

    const key = isChampion
      ? 'champion|' + String(data.champion)
      : String(data.phase) + '|' + String(data.duel) + '|' + String(data.duelWinner);
    if(key !== previousDuelKey){
      launchConfetti();
    }
    previousDuelKey = key;
  }else{
    normalView.classList.remove('hidden');
    winnerView.classList.add('hidden');
    previousDuelKey = null;
  }
}

function formatTime(seconds){
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// ============================================================
// CONFETTIS (canvas, aucune dépendance externe)
// ============================================================
function launchConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#22c55e', '#facc15', '#ef4444', '#3b82f6', '#f8fafc'];

  const pieces = [];
  for(let i=0; i<160; i++){
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 10,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 2 + Math.random() * 3,
      speedX: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10
    });
  }

  const duration = 4000;
  const start = Date.now();

  function frame(){
    const elapsed = Date.now() - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pieces.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });

    if(elapsed < duration){
      requestAnimationFrame(frame);
    }else{
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

poll();
setInterval(poll, POLL_INTERVAL_MS);

// ✅ Sécurité anti-gel : les navigateurs suspendent parfois l'exécution JS
// d'un onglet resté longtemps en arrière-plan (économie de mémoire), ce qui
// fige l'affichage sur un ancien état. Un rechargement complet périodique
// garantit que l'écran ne reste jamais bloqué plus de quelques minutes.
setTimeout(() => location.reload(), 3 * 60 * 1000);

// Complément léger : force un poll immédiat dès que l'onglet redevient
// visible (utile si le gel est partiel, avant le rechargement de sécurité).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') poll();
});
</script>
</body>
</html>
