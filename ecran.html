<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenieTech — Grand Écran</title>
<style>
:root{--bg:#050914;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--gold:#facc15}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:radial-gradient(circle at 50% 30%,#14213a 0%,var(--bg) 68%);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.screen{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 6vw;text-align:center;gap:2.2vh;overflow:hidden}
.question{font-size:clamp(18px,2.6vw,38px);line-height:1.35;font-weight:800;max-width:92vw;white-space:pre-line}
.timer{font-size:clamp(40px,5.5vw,84px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.running{color:var(--green)}
.timer.warning{color:var(--gold)}
.timer.danger{color:var(--red);animation:dangerPulse .8s infinite}
.timer.off{color:var(--muted)}
@keyframes dangerPulse{50%{opacity:.45}}
.team{font-size:clamp(24px,3.4vw,52px);font-weight:900;line-height:1;color:var(--green);min-height:1.2em}
.team.active{animation:buzzIn .35s ease-out}
@keyframes buzzIn{0%{transform:scale(1.12);opacity:.2}100%{transform:scale(1);opacity:1}}
.connErr{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:var(--red);font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="screen">
  <div id="question" class="question">En attente de la prochaine question</div>
  <div id="timer" class="timer off">--:--</div>
  <div id="team" class="team"></div>
</div>

<div id="connErr" class="connErr"></div>

<div id="soundOverlay" style="position:fixed;inset:0;background:rgba(5,9,20,.94);display:flex;align-items:center;justify-content:center;z-index:50;">
  <button id="enableSoundBtn" style="padding:18px 32px;border-radius:14px;border:none;background:#22c55e;color:#04120a;font-weight:900;font-size:clamp(16px,2vw,22px);cursor:pointer;">🔊 Activer le son</button>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuJMaKi6EvPAlEGRKmtxV994zRJz36m12iD9nSJPzglmi3gDxW1zgyTGEgAISwfpgZNg/exec";
const POLL_INTERVAL_MS = 500;

let previousTeam = null;
let audioCtx = null;
let soundEnabled = false;
let firstPoll = true;

document.getElementById('enableSoundBtn').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundEnabled = true;
  document.getElementById('soundOverlay').style.display = 'none';
});

function playBuzzSound(){
  if(!soundEnabled || !audioCtx) return;
  try{
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }catch(err){ /* son non supporte, on ignore silencieusement */ }
}

// ============================================================
// SYNCHRONISATION AVEC APPS SCRIPT
// ============================================================
async function poll(){
  const connErr=document.getElementById('connErr');
  try{
    const response=await fetch(SCRIPT_URL+'?t='+Date.now(),{method:'GET',cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const state=await response.json();
    connErr.textContent='';
    applyState(state);
  }catch(error){
    connErr.textContent='Connexion au serveur indisponible';
    // On conserve le dernier état connu pendant une micro-coupure.
  }
}

function applyState(data){
  document.getElementById('question').textContent =
    data.questionText || 'En attente de la prochaine question';

  updateTimer(data);
  updateTeam(data);
  firstPoll=false;
}

function updateTimer(data){
  const timer=document.getElementById('timer');

  let remaining=null;
  if(data.questionEndAt != null){
    remaining=Math.max(0,Math.ceil((data.questionEndAt-Date.now())/1000));
  }

  if(remaining==null || !data.questionActive){
    timer.textContent='--:--';
    timer.className='timer off';
    return;
  }

  timer.textContent=formatTime(remaining);
  timer.className='timer '+(remaining<=5?'danger':remaining<=10?'warning':'running');
}

function updateTeam(data){
  const team=document.getElementById('team');
  const activeTeam=data.activeTeam || null;

  if(activeTeam){
    team.textContent=activeTeam;
    team.className='team active';

    const key=String(activeTeam)+'|'+String(data.questionId ?? '');
    if(key!==previousTeam){
      team.classList.remove('active');
      void team.offsetWidth;
      team.classList.add('active');
      if(!firstPoll) playBuzzSound();
    }
    previousTeam=key;
  }else{
    team.textContent='';
    team.className='team';
  }
}

function formatTime(seconds){
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

poll();
setInterval(poll,POLL_INTERVAL_MS);
</script>
</body>
</html>
