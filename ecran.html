<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenieTech — Grand Écran</title>
<style>
:root{--bg:#050914;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--gold:#facc15}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.screen{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 6vw;text-align:center;gap:3vh}

.question{font-size:clamp(20px,2.6vw,40px);line-height:1.4;font-weight:800;max-width:85vw;white-space:pre-line}

.timer{font-size:clamp(40px,6vw,90px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.timer.running{color:var(--green)}
.timer.warning{color:var(--gold)}
.timer.danger{color:var(--red);animation:dangerPulse .8s infinite}
@keyframes dangerPulse{50%{opacity:.45}}
.hidden{display:none}

.team{font-size:clamp(20px,3vw,44px);font-weight:900;color:var(--green)}
.team.buzzIn{animation:buzzIn .35s ease-out}
@keyframes buzzIn{0%{transform:scale(1.1);opacity:.2}100%{transform:scale(1);opacity:1}}

.connection{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:var(--red);font-size:11px;opacity:.7}

#soundOverlay{position:fixed;inset:0;background:rgba(5,9,20,.94);display:flex;align-items:center;justify-content:center;z-index:50}
#enableSoundBtn{padding:14px 24px;border-radius:12px;border:none;background:#22c55e;color:#04120a;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="screen">
  <div id="question" class="question">En attente de la prochaine question</div>
  <div id="timer" class="timer hidden">00:00</div>
  <div id="team" class="team hidden"></div>
</div>

<div id="connection" class="connection"></div>

<div id="soundOverlay">
  <button id="enableSoundBtn">🔊 Activer le son</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwITBnp3_airQfBXI5BOjo1ty3-Jkmp-dwNI2aXyw7c2HpNlruAXT9AqzwAqgSrr0E0/exec";
const POLL_INTERVAL_MS = 500;

let previousTeam = null;
let audioCtx = null;
let soundEnabled = false;
let firstPoll = true;

document.getElementById('enableSoundBtn').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundEnabled = true;
  document.getElementById('soundOverlay').style.display = 'none';
});

function playBuzzSound(){
  if(!soundEnabled || !audioCtx) return;
  try{
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }catch(err){ /* son non supporte */ }
}

async function poll(){
  const connection = document.getElementById('connection');
  try{
    const response = await fetch(SCRIPT_URL + '?t=' + Date.now(), { method:'GET', cache:'no-store' });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const state = await response.json();
    connection.textContent = '';
    applyState(state);
  }catch(error){
    connection.textContent = 'Connexion au serveur indisponible';
  }
}

function applyState(data){
  document.getElementById('question').textContent =
    data.questionText || 'En attente de la prochaine question';

  updateTimer(data);
  updateTeam(data);
  firstPoll = false;
}

// Chrono visible UNIQUEMENT quand il tourne réellement (après buzz ou Top Chrono)
function updateTimer(data){
  const timer = document.getElementById('timer');

  let remaining = null;
  if(data.questionEndAt != null && data.questionActive){
    remaining = Math.max(0, Math.ceil((data.questionEndAt - Date.now()) / 1000));
  }

  if(remaining == null || !data.questionActive){
    timer.classList.add('hidden');
    return;
  }

  timer.classList.remove('hidden');
  timer.textContent = formatTime(remaining);
  timer.className = 'timer ' + (remaining<=5?'danger':remaining<=10?'warning':'running');
}

// Équipe qui a buzzé / qui répond - affichée seulement quand pertinent
function updateTeam(data){
  const team = document.getElementById('team');
  const activeTeam = data.activeTeam || null;

  if(!activeTeam){
    team.classList.add('hidden');
    previousTeam = null;
    return;
  }

  team.classList.remove('hidden');
  team.textContent = activeTeam;

  const key = String(activeTeam) + '|' + String(data.questionId ?? '');
  if(key !== previousTeam){
    team.classList.remove('buzzIn');
    void team.offsetWidth;
    team.classList.add('buzzIn');
    if(!firstPoll) playBuzzSound();
  }
  previousTeam = key;
}

function formatTime(seconds){
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
