<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GenieTech - Buzzer</title>
<style>
  :root {
    --bg: #0b1120;
    --accent: #16a34a;
    --danger: #dc2626;
    --neutral: #334155;
    --text: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .screen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 16px 40px;
    text-align: center;
  }
  .brand { font-size: 13px; letter-spacing: 3px; opacity: 0.5; margin-top: 8px; }
  .team-name { font-size: clamp(28px, 8vw, 44px); font-weight: 800; margin-top: 12px; }
  .buzz-btn {
    flex: 1;
    width: 100%;
    max-width: 420px;
    margin: 24px 0;
    border: none;
    border-radius: 32px;
    font-size: clamp(32px, 10vw, 56px);
    font-weight: 900;
    color: white;
    background: linear-gradient(180deg, #22c55e, #15803d);
    box-shadow: 0 10px 0 #14532d, 0 14px 24px rgba(0,0,0,0.5);
    transition: transform 0.05s ease;
    letter-spacing: 2px;
  }
  .buzz-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #14532d, 0 6px 12px rgba(0,0,0,0.5); }
  .buzz-btn.lost {
    background: linear-gradient(180deg, #475569, #1e293b);
    box-shadow: 0 10px 0 #0f172a, 0 14px 24px rgba(0,0,0,0.5);
  }
  .buzz-btn.eliminated {
    background: linear-gradient(180deg, #7f1d1d, #450a0a);
    box-shadow: 0 10px 0 #2a0505, 0 14px 24px rgba(0,0,0,0.5);
  }
  .buzz-btn.direct {
    background: linear-gradient(180deg, #475569, #1e293b);
    box-shadow: 0 10px 0 #0f172a, 0 14px 24px rgba(0,0,0,0.5);
    font-size: clamp(18px, 5vw, 28px);
  }
  .buzz-btn:disabled { opacity: 1; }
  .status { font-size: 18px; font-weight: 600; min-height: 28px; }
  .status.ready { color: #94a3b8; }
  .status.won { color: #4ade80; }
  .status.lost { color: #f87171; }
  .status.eliminated { color: #fca5a5; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: middle; }
  .setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; padding: 24px; }
  .setup input {
    width: 100%; max-width: 320px; padding: 14px 16px; font-size: 18px;
    border-radius: 12px; border: 1px solid var(--neutral); background: #111827; color: var(--text);
  }
  .setup button { padding: 14px 28px; font-size: 16px; font-weight: 700; border-radius: 12px; border: none; background: var(--accent); color: white; }
  .conn { font-size: 12px; opacity: 0.4; }
</style>
</head>
<body>

<div id="setup" class="setup" style="display:none;">
  <div class="brand">GENIETECH · BUZZER</div>
  <input id="nameInput" type="text" placeholder="Nom de l'equipe" autocomplete="off">
  <button onclick="confirmName()">Confirmer</button>
</div>

<div id="screen" class="screen" style="display:none;">
  <div>
    <div class="brand">GENIETECH</div>
    <div class="team-name" id="teamName">-</div>
  </div>

  <button id="buzzBtn" class="buzz-btn" onclick="sendBuzz()">BUZZ</button>

  <div>
    <div id="statusText" class="status ready"><span class="dot"></span>Prete</div>
    <div class="conn" id="connText">connexion...</div>
  </div>
</div>

<script>
  // ==== A CONFIGURER ====
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuJMaKi6EvPAlEGRKmtxV994zRJz36m12iD9nSJPzglmi3gDxW1zgyTGEgAISwfpgZNg/exec"; // URL /exec du Web App
  const POLL_INTERVAL_MS = 1000;
  // =======================

  let teamName = null;
  let hasBuzzedLocally = false;
  let lastQuestionId = null;
  let pollTimer = null;
  let audioCtx = null;

  function playBuzzSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } catch (err) { /* son non supporte, on ignore silencieusement */ }
  }

  function init() {
    const params = new URLSearchParams(window.location.search);
    const nomParam = params.get("nom");
    if (nomParam) {
      teamName = decodeURIComponent(nomParam);
      startScreen();
    } else {
      document.getElementById("setup").style.display = "flex";
    }
  }

  function confirmName() {
    const val = document.getElementById("nameInput").value.trim();
    if (!val) return;
    teamName = val;
    document.getElementById("setup").style.display = "none";
    startScreen();
  }

  function startScreen() {
    document.getElementById("teamName").textContent = teamName;
    document.getElementById("screen").style.display = "flex";
    poll();
    pollTimer = setInterval(poll, POLL_INTERVAL_MS);
  }

  async function poll() {
    try {
      const res = await fetch(SCRIPT_URL + "?t=" + Date.now(), { method: "GET", cache: "no-store" });
      const data = await res.json();
      document.getElementById("connText").textContent = "";
      applyState(data);
    } catch (err) {
      document.getElementById("connText").textContent = "connexion instable...";
    }
  }

  function applyState(data) {
    const btn = document.getElementById("buzzBtn");
    const statusEl = document.getElementById("statusText");

    // Nouvelle question detectee -> on reinitialise l'etat local optimiste
    if (data.questionId !== lastQuestionId) {
      hasBuzzedLocally = false;
      lastQuestionId = data.questionId;
    }

    const eliminated = (data.eliminatedTeams || []).indexOf(teamName) !== -1;

    // Question DIRECTE / PROBLEME : pas de buzzer, le jury designe l'equipe
    if (data.questionType && !data.buzzerEnabled) {
      if (data.activeTeam === teamName) {
        btn.disabled = true;
        btn.className = "buzz-btn won";
        btn.textContent = "A VOUS";
        statusEl.className = "status won";
        statusEl.innerHTML = '<span class="dot"></span>Repondez au jury';
      } else {
        btn.disabled = true;
        btn.className = "buzz-btn direct";
        btn.textContent = "QUESTION DIRECTE";
        statusEl.className = "status ready";
        statusEl.innerHTML = data.activeTeam
          ? '<span class="dot"></span>' + escapeHtml(data.activeTeam) + ' repond'
          : '<span class="dot"></span>Le jury attribue la question';
      }
      return;
    }

    // Equipe eliminee sur cette question
    if (eliminated) {
      btn.disabled = true;
      btn.className = "buzz-btn eliminated";
      btn.textContent = "ELIMINEE";
      statusEl.className = "status eliminated";
      statusEl.innerHTML = '<span class="dot"></span>Mauvaise reponse - en attente de la prochaine question';
      return;
    }

    // Pas de question active / pas encore buzze -> pret
    if (!data.anyBuzzed) {
      hasBuzzedLocally = false;
      btn.disabled = !data.canBuzz;
      btn.textContent = "BUZZ";
      btn.className = "buzz-btn";
      statusEl.className = "status ready";
      statusEl.innerHTML = data.canBuzz
        ? '<span class="dot"></span>Prete'
        : '<span class="dot"></span>En attente de la question';
      return;
    }

    // Une equipe a buzze
    if (data.first === teamName) {
      btn.disabled = true;
      btn.textContent = "BUZZE !";
      btn.className = "buzz-btn won";
      statusEl.className = "status won";
      statusEl.innerHTML = '<span class="dot"></span>Vous avez buzze en premier';
    } else {
      btn.disabled = true;
      btn.textContent = "VERROUILLE";
      btn.className = "buzz-btn lost";
      statusEl.className = "status lost";
      statusEl.innerHTML = '<span class="dot"></span>' + escapeHtml(data.first) + ' a buzze en premier';
    }
  }

  async function sendBuzz() {
    if (hasBuzzedLocally) return;
    hasBuzzedLocally = true;
    playBuzzSound();

    const btn = document.getElementById("buzzBtn");
    btn.disabled = true; // reponse optimiste immediate

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "buzz", equipe: teamName })
      });
      await res.json();
      poll();
    } catch (err) {
      hasBuzzedLocally = false;
      btn.disabled = false;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
</body>
</html>
